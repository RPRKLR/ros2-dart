name: ros2_flutter_example
description: A robot control panel built with ros2_flutter.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  ros2_flutter:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# dependency_overrides are not inherited from ros2_flutter, so the example
# has to point at the local core package itself.
dependency_overrides:
  ros2_client:
    path: ../../ros2_client

flutter:
  uses-material-design: true
